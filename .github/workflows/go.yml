# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Build
      run: go build -v ./...

    # Workspace mode: `./...` from the repo root only matches root-module
    # packages. The ten sub-modules must be tested explicitly or a failing
    # sub-module (common, api, ...) stays invisible.
    - name: Test
      run: |
        go test -v ./...
        for m in api client common config jobqueue model model/user render translation transport; do
          echo "== $m =="
          (cd "$m" && go test -count=1 ./...)
        done
